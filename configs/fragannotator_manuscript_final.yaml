schema_version: 1
config_id: fragannotator_manuscript_final_fixed_evidence_fusion_v1
method_family: fixed_evidence_fusion_candidate_ranking
method_label: FragAnnotator
adapter_id: fragannotor_casmi_formal_fixed_component_score_mode_v1
primary_score_field: fragannotor_casmi_adapter_score
frozen_for_manuscript: true
freeze_scope:
  sections:
    - "3.1"
    - "3.2"
    - "3.3"
    - "3.4"
    - "3.5"
  rule: "All manuscript analyses must use this definition unless every affected result is invalidated and recomputed."
claim_guardrail:
  main_method: "Fixed evidence-fusion candidate-ranking framework."
  not_main_method: "Trained neural checkpoint."
  neural_checkpoint_policy: "Existing trained neural checkpoint outputs are audit or negative-control evidence only unless a leakage-safe matched-query rerun proves superiority over this frozen configuration."
components:
  native_sirius_formula_score:
    field: casmi_native_sirius_formula_score
    source_field: native_sirius_formula_score
    weight: 0.65
    range: [0.0, 1.0]
    computation: "Native SIRIUS formula plausibility score joined by candidate molecular formula; formula evidence only."
    missing_value: 0.0
    provenance_guardrail: "Do not describe SIRIUS-derived formula or peak annotations as independently generated by FragAnnotator."
  precursor_mass_consistency:
    field: casmi_mass_consistency_score
    weight: 0.20
    range: [0.0, 1.0]
    computation: "Deterministic precursor mass agreement between candidate formula and observed precursor m/z under the query adduct and ion mode."
    tolerance_policy: "Implemented by mass_consistency_score in scripts/run_benchmark.py."
    missing_value: 0.0
  common_fragment_or_neutral_loss_formula_plausibility:
    field: casmi_fragment_formula_score
    weight: 0.15
    range: [0.0, 1.0]
    computation: "Deterministic match of high-intensity experimental peaks against formula-derived common fragment and neutral-loss target masses."
    peak_policy: "Uses up to 40 highest-intensity experimental peaks; relative intensity weights are square-root scaled; local mass match kernel follows formula_fragment_plausibility_score in scripts/run_benchmark.py."
    missing_value: 0.0
score_formula:
  expression: "clip01(0.65 * native_sirius_formula_score + 0.20 * precursor_mass_consistency + 0.15 * common_fragment_or_neutral_loss_formula_plausibility)"
  output_range: [0.0, 1.0]
  normalization: "All component scores are bounded to [0, 1]; final weighted sum is clipped to [0, 1]."
  training: "No CASMI label training, model fitting, or weight search."
missing_value_handling:
  numeric_nan_or_blank: 0.0
  unavailable_native_sirius_formula_score: 0.0
  missing_formula_or_peaks_for_fragment_score: 0.0
candidate_policy:
  casmi2022_candidate_source: data/proc/casmi_2022/cand_df.pkl
  true_candidate_policy: "Insert the authentic structure into the query candidate set if absent before scoring."
  candidate_limit: null
  filtering: "Use the protocol candidate set for each query; do not select candidates based on test labels."
formula_policy:
  formula_source: "Candidate formula from structure when available; SIRIUS scores are joined by formula."
  formula_filtering: "No label-informed formula filter. Formula evidence affects score only through frozen components."
adduct_policy:
  source: "Observed CASMI query precursor/adduct field."
  conversion: "No adduct conversion for native baseline metrics; FragAnnotator mass consistency uses the observed query adduct and ion mode."
preprocessing:
  spectra: "Use CASMI experimental MS/MS peaks as loaded by scripts/run_benchmark.py."
  peak_selection: "Top 40 peaks by intensity for fragment-formula plausibility."
  structures: "Use repository candidate SMILES/formula fields and RDKit-derived formula/inchikey where required by existing benchmark code."
ranking:
  sort_order:
    - "score descending"
    - "deterministic candidate identifier tie-break ascending when implemented by the evaluator"
  tie_policy: "Use existing benchmark evaluator deterministic ordering; do not apply random tie-breaking."
randomness:
  random_seed: 0
  stochastic_components: false
model_versioning:
  code_reference:
    file: scripts/run_benchmark.py
    functions:
      - casmi_fragannotor_adapter_components
      - formula_fragment_plausibility_score
      - mass_consistency_score
      - model_score
      - write_casmi_adapter_audit
  checkpoint: null
  checkpoint_policy: "No learned checkpoint is part of the frozen main method."
query_inclusion:
  section_3_1: "Largest protocol-consistent CASMI2022 FragAnnotator-only set, currently 229 queries."
  section_3_2: "Matched supported CASMI2022 comparison set, currently 170 CFM-ID-supported [M+H]+ queries, after manifest freeze."
  section_3_3: "Largest common query set where all ablation components are available; use one shared query set for all variants."
  section_3_4: "CASMI2022 case studies selected after frozen scoring, including successes and limitations."
  section_3_5: "External or independent data only after independence audit; do not call PFAS locked-test independent unless audit proves no development use."
known_audit_results:
  formal_fixed_component_mode:
    query_count: 229
    result_file: results/casmi2022_fragannotor_formal_components/casmi2022_fragannotor_formal_query_results.csv
  trained_neural_checkpoint:
    result_file: results/casmi2022_fragannotor_trained_neural_v1/casmi2022_fragannotor_trained_neural_summary.csv
    manuscript_role: "Audit or negative-control result only."
